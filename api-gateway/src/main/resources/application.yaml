server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true


          routes:
            - id: user-service-openapi
              uri: http://localhost:8081
              predicates:
                - Path=/openapi/user-service
              filters:
                - SetPath=/v3/api-docs

            - id: product-service-openapi
              uri: http://localhost:8082
              predicates:
                - Path=/openapi/product-service
              filters:
                - SetPath=/v3/api-docs

            - id: cart-service-openapi
              uri: http://localhost:8083
              predicates:
                - Path=/openapi/cart-service
              filters:
                - SetPath=/v3/api-docs

            - id: order-service-openapi
              uri: http://localhost:8084
              predicates:
                - Path=/openapi/order-service
              filters:
                - SetPath=/v3/api-docs

            - id: user-service
              uri: http://localhost:8081
              predicates:
              - Path=/api/users/**,/api/admin/**

            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/product/**

            - id: cart-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/cart/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/orders/**


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: User Service
    persist-authorization: true
    urls:
      - name: User Service
        url: /openapi/user-service
      - name: Product Service
        url: /openapi/product-service
      - name: Cart Service
        url: /openapi/cart-service
      - name: Order Service
        url: /openapi/order-service
