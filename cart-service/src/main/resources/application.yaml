server:
  port: 8083

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  #專案名稱
  application:
    name: cart-service

  datasource:
    url:  jdbc:mysql://localhost:3309/cart_db?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
    username: cart_app
    password: ${CART_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.company.ecommerce.cart.model

management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

logging:
  level:
    com.company.ecommerce.cart.mapper: debug



services:
  product-service:
    url: http://localhost:8082
